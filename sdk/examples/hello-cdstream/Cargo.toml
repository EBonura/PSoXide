# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name    = "hello-cdstream"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hello-cdstream"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-cdstream = { path = "../../crates/psx-cdstream" }
psx-font     = { path = "../../crates/psx-font" }
psx-fmv      = { path = "../../crates/psx-fmv" }
psx-gpu      = { path = "../../crates/psx-gpu" }
psx-io       = { path = "../../crates/psx-io" }
psx-rt       = { path = "../../crates/psx-rt" }
psx-vram     = { path = "../../crates/psx-vram" }
