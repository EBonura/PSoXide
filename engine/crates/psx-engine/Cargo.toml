[package]
name    = "psx-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PSoXide engine layer. Scene/App framework + canonical unit types (Angle, Frames) sitting on top of the SDK. Host-independent; MIPS-target only."

[dependencies]
# Explicit paths rather than `workspace = true` so this crate
# resolves cleanly when consumed from outside its native workspace
# (the editor frontend pulls it in for the 3D-viewport host renderer).
psx-asset = { path = "../../../sdk/crates/psx-asset" }
psx-font  = { path = "../../../sdk/crates/psx-font" }
psx-gpu   = { path = "../../../sdk/crates/psx-gpu" }
psx-gte   = { path = "../../../sdk/crates/psx-gte" }
psx-io    = { path = "../../../sdk/crates/psx-io" }
psx-level = { path = "../psx-level" }
psx-math  = { path = "../../../sdk/crates/psx-math" }
psx-telemetry = { path = "../../../sdk/crates/psx-telemetry" }
psx-pad   = { path = "../../../sdk/crates/psx-pad" }
psx-spu   = { path = "../../../sdk/crates/psx-spu" }
psx-sfx   = { path = "../../../sdk/crates/psx-sfx" }
psx-vram  = { path = "../../../sdk/crates/psx-vram" }

[target.'cfg(target_arch = "mips")'.dependencies]
psx-rt = { path = "../../../sdk/crates/psx-rt" }

[dev-dependencies]
trybuild = "1"

[features]
default = []
boot-trace = ["psx-rt/boot-trace"]
emulator-telemetry = []
hardware-boot-visual = []
room-surface-profile = []
# Experimental fixed 3x3 projection lattice for one-level TR room
# subdivision. Kept opt-in until the Cortex v1 A/B has been recorded.
tr-subdivision-lattice = []
# Per-candidate stage marks inside ROOM_CELL_SELECT (cell_lookup /
# cell_depth / cell_collect CSV columns). Off by default: the per-cell
# begin/end telemetry writes cost ~4k cycles/frame on the benchmark tape.
cell-select-profile = []
# Player skinned-vertex live-capture instrument (the HWB-008..011
# explosion-hunt channel). Off by default: the per-vertex observe and
# per-joint compose recording cost real cycles and must not ride along
# in shipping or performance-measurement builds.
vert-debug = []

[lints]
workspace = true
