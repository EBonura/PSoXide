name: SDK
on:
  push:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_sony_material_audit.py
      - run: python3 tools/sony-material-audit.py
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
      - run: make check
      - run: make test
      - run: make lint
      - name: Build a PS1 executable without editor or emulator sources
        run: make hello-tri
