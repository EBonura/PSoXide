# Quick answers. `home = true` puts a question in the home page strip (keep it
# to about ten); every question appears on /faq/, grouped, with its id as anchor.
# Answers are markdown. Tokens in [[double brackets]] are filled from the data
# files at build time (see templates/components.html), so numbers
# never go stale and are never typed in by hand.
# `link` is a site path ("@/...") or a full URL.

