[package]
name    = "toolchain-probe"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "toolchain-probe"
path = "src/main.rs"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true

[dependencies]
psx-rt  = { path = "../../../sdk/crates/psx-rt", features = ["alloc"] }
psx-gpu = { path = "../../../sdk/crates/psx-gpu" }
psx-bsp = { path = "../../crates/psx-bsp" }
