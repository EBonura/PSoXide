[package]
name        = "psx-grid"
version     = "0.1.0"
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Sector-grid level format (PGL), its zero-copy reader, native O(1) sector collision and the grid world renderer. Shared by the editor cook and the playtest guest."

[lints]
workspace = true

[features]
# Host-side writer and cook helpers (needs `std`). The guest never enables it.
std = []

[dependencies]
# Explicit paths (not `workspace = true`): the crate is consumed from the
# editor workspace and the guest workspaces alike.
psx-engine = { path = "../psx-engine" }
psx-gpu    = { path = "../../../sdk/crates/psx-gpu" }
psx-gte    = { path = "../../../sdk/crates/psx-gte" }
psx-math   = { path = "../../../sdk/crates/psx-math" }
