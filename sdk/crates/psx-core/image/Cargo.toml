# SPDX-License-Identifier: GPL-2.0-or-later
# The scene core's image, built alone at the window (image.ld). See ../README.md.
[package]
name    = "psx-core-image"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "psx-core-image"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = "z"
panic = "abort"
codegen-units = 1
lto = true
debug = false

[dependencies]
psx-core = { path = ".." }

[features]
# A second image with different bytes, for the hash-mismatch tests only.
alt = []
