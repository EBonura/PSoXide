<svg xmlns="http://www.w3.org/2000/svg" width="176" height="32" viewBox="0 0 176 32">
  <!--
    Cortex stance HUD, native-pixel-grid variant (horn: none, gems: hex). Units are screen pixels and
    every coordinate is a whole number. Cells and gems are the same shape repeated at a fixed 12 px
    step (a multiple of 4), all at one y, so they are pixel-identical on screen.
    Draw order, back to front: plate (dimmed, offset up), plate, health_0..9, emblem, emblem_core,
    rail, energy_0..9.
