[package]
name    = "editor-playtest"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "editor-playtest"
path = "src/main.rs"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true

[features]
default = [
    "cd-stream-bench",
    # Bucketed = OT-as-radix-sort, no per-frame comparison sort. The exact
    # intra-slot ordering modes (slot/global/linked) cost 122k-313k extra
    # cycles per render vblank for no observed visual difference; see
    # docs/perf-30fps.md experiment 2.
    "world-order-bucketed",
    "world-grid-visible",
    "ot-2048",
    # Camera-independent visible-cell fills: the cached candidate list
    # per (room, anchor) holds the full PVS set and per-frame camera
    # culling happens downstream in cell_select/surface tests, so
    # camera rotation no longer refills every drawn room each tick
    # (was 33k avg / 184k spike ticks on the benchmark tape).
    "vis-anchor-pvs-candidates",
]
cd-stream-bench = ["dep:psx-io"]
cd-stream-benchmark = ["cd-stream-bench"]
boot-trace = ["psx-engine/boot-trace", "psx-rt/boot-trace"]
emulator-telemetry = ["psx-engine/emulator-telemetry"]
hardware-boot-visual = ["psx-engine/hardware-boot-visual"]
# The HWB explosion-hunt live-capture overlay (4 cycling pages + the
# engine-side per-vertex capture). NOT a default: it costs real cycles
# and draw packets, so probe builds request it explicitly via
# EDITOR_PLAYTEST_FEATURES="... vert-debug-overlay".
vert-debug-overlay = ["psx-engine/vert-debug"]
world-order-global = []
world-order-slot = []
world-order-linked = []
world-order-bucketed = []
world-grid-visible = []
vis-anchor-cache = []
vis-anchor-pvs-candidates = []
vis-broad-pvs = []
vis-coarse-yaw = []
vis-full-active-chunks = []
vis-player-anchor = []
room-surface-profile = ["psx-engine/room-surface-profile"]
cell-select-profile = ["psx-engine/cell-select-profile"]
# On-screen presented-fps + worst-frame-gap counter for hardware
# ratification burns. Off by default: shipping builds must not carry it.
fps-overlay = []
ot-1024 = []
ot-2048 = []

[dependencies]
psx-asset  = { path = "../../../sdk/crates/psx-asset" }
psx-engine = { path = "../../crates/psx-engine" }
psx-font   = { path = "../../../sdk/crates/psx-font" }
psx-gpu    = { path = "../../../sdk/crates/psx-gpu" }
psx-gte    = { path = "../../../sdk/crates/psx-gte" }
psx-io     = { path = "../../../sdk/crates/psx-io", optional = true }
psx-level  = { path = "../../crates/psx-level" }
psx-math   = { path = "../../../sdk/crates/psx-math" }
psx-rt     = { path = "../../../sdk/crates/psx-rt" }
psx-vram   = { path = "../../../sdk/crates/psx-vram" }
