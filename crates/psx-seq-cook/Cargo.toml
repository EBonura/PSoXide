[package]
name = "psx-seq-cook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side cook for psx-seq sequenced music: imports N64 libultra sequence and soundfont data from a ROM the player owns, converts samples to SPU-ADPCM and writes the psx-seq containers; also a host renderer that plays a cooked song to WAV."

[dependencies]
psx-audio-cook = { path = "../psx-audio-cook" }
psx-seq = { path = "../../sdk/crates/psx-seq" }
psx-sfx = { path = "../../sdk/crates/psx-sfx" }

[lints]
workspace = true
