name: SDK
on:
  push:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo run --locked -q -p xtask -- material-audit
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
      - run: make check
      - run: make test
      - run: make lint
      - name: Build a PS1 executable without editor or emulator sources
        run: make hello-tri
  miri:
    # Every SDK crate under Miri, Stacked and Tree Borrows, on the pinned
    # nightly (rust-toolchain.toml installs the component). Its own job:
    # interpreted tests take far longer than the native ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: make miri
