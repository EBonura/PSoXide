[package]
name         = "psx-loading"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "A loading indicator for blocking loads: the corner widget (a small black square with the game's own animation in it), or a label with stepping dots, drawn as plain GP0 rectangles so it needs no VRAM, no atlas and no heap."

[dependencies]
psx-font = { workspace = true }
psx-io   = { workspace = true }

[lints]
workspace = true
