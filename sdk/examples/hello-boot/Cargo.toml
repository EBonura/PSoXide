# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name    = "hello-boot"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hello-boot"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[features]
# Resident code calls a function placed in `.boot_inner` (boot-only code only boot code calls):
# the link must fail (psoxide-boot.ld's cross-reference check). For the build script's
# negative test only.
cross-ref = []
# Boot-only code in a section without the `.text.` prefix: the link must fail (psoxide-boot.ld). For
# the build script's negative test only.
unprefixed = []
# Resident code uploads a font after boot memory is overwritten: its own resident copy of the
# upload, never the splash's boot-only one (psx-splash compiles its own). Run it: `hello-boot: PASS`.
resident-font = ["dep:psx-font", "dep:psx-vram"]
# The program keeps the splash's font (psx_splash::show_keeping_font) and draws with that atlas
# after boot memory is overwritten: no upload of its own (kept.bin).
kept-font = ["dep:psx-font"]

[dependencies]
psx-core    = { path = "../../crates/psx-core", features = ["link"] }
psx-display = { path = "../../crates/psx-display" }
psx-fmv     = { path = "../../crates/psx-fmv" }
psx-font    = { path = "../../crates/psx-font", optional = true }
psx-gpu     = { path = "../../crates/psx-gpu" }
psx-pad     = { path = "../../crates/psx-pad" }
psx-rt      = { path = "../../crates/psx-rt", features = ["host-tty"] }
psx-splash  = { path = "../../crates/psx-splash" }
psx-vram    = { path = "../../crates/psx-vram", optional = true }
