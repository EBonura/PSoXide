[package]
name         = "psx-sfx"
version      = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Sound effects on the PS1 SPU: a sequential sample bank, correct key-on and the length-based cutoff a one-shot needs on real hardware, plus a host-testable voice mixer (lanes, priorities, handles, virtual loops), spatial gains and master volumes."

[dependencies]
psx-spu   = { path = "../psx-spu" }
psx-asset = { path = "../psx-asset" }
psx-math  = { path = "../psx-math" }

[lints]
workspace = true
