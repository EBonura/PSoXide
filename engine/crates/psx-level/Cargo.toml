[package]
name        = "psx-level"
version     = "0.1.0"
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Shared no_std level manifest schema. Generated by the editor compiler, consumed by the runtime: assets, materials, rooms, residency."

[lints]
workspace = true

[features]
# The binary form of a level's own records (`wire`) allocates, so it is opt-in:
# Half-Life and Counter-Strike link psx-level through psx-engine with `core` alone.
wire = []

[dependencies]
# Explicit path (not `workspace = true`): psx-level is consumed from the
# emu and editor workspaces too, and workspace inheritance only resolves
# against the engine workspace root.
psx-math = { path = "../../../sdk/crates/psx-math" }
