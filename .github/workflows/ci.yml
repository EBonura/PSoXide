name: SDK
on: [push, pull_request]
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y binutils-mipsel-linux-gnu
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
      - run: make check
      - run: make test
      - run: make lint
      - name: Build a PS1 executable without editor or emulator sources
        env:
          OBJDUMP: mipsel-linux-gnu-objdump
        run: make hello-tri
