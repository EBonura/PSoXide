name: Publish a verified itch.io package
description: Validate and optionally publish one repository's staged package to its allowlisted itch.io channel.

inputs:
  source-dir:
    description: Package directory, relative to the caller workspace.
    required: true
  target:
    description: Fully qualified itch.io target in owner/game:channel form.
    required: true
  user-version:
    description: SemVer-compatible version recorded by Butler.
    required: true
  publish:
    description: Set to true only for an intentional publishing event.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate package and destination
      shell: bash
      env:
        ITCH_SOURCE_DIR: ${{ inputs.source-dir }}
        ITCH_TARGET: ${{ inputs.target }}
        ITCH_USER_VERSION: ${{ inputs.user-version }}
      run: "$GITHUB_ACTION_PATH/scripts/validate-package.sh"

    - name: Install Butler
      if: inputs.publish == 'true'
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/install-butler.sh"

    - name: Publish verified package
      if: inputs.publish == 'true'
      shell: bash
      env:
        ITCH_SOURCE_DIR: ${{ inputs.source-dir }}
        ITCH_TARGET: ${{ inputs.target }}
        ITCH_USER_VERSION: ${{ inputs.user-version }}
        BUTLER_BIN: ${{ runner.temp }}/butler/butler
      run: "$GITHUB_ACTION_PATH/scripts/publish.sh"
