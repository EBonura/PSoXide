[package]
name         = "psx-fmv"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "FMV playback building blocks: STR sector demux, BS v2 bitstream to MDEC run-length decode, MDEC upload/decode via DMA0/DMA1, ISO9660 root-file lookup."

[dependencies]
# The bitstream, STR and ISO parsers are pure logic and build for guest and
# host alike (host `cargo test` covers them). The MDEC driver touches MMIO
# and only exists on the MIPS guest.

[target.'cfg(target_arch = "mips")'.dependencies]
psx-io = { workspace = true }

[lints]
workspace = true
