[package]
name    = "mkisopsx"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
# `cargo run -p mkisopsx` (the Makefile, game builds) runs the disc writer, not psx-nest.
default-run = "mkisopsx"


[dependencies]
psx-iso  = { path = "../../crates/psx-iso" }
psx-gate = { path = "../../crates/psx-gate" }
lz4_flex = { version = "0.11", default-features = false }

[[bin]]
name = "mkisopsx"
path = "src/main.rs"

[[bin]]
name = "psx-nest"
path = "src/bin/psx-nest.rs"

[[bin]]
name = "psx-fault"
path = "src/bin/psx-fault.rs"
