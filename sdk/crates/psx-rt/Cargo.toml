[package]
name         = "psx-rt"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "PS1 bare-metal runtime: _start, panic, heap. Makes no BIOS call."

[dependencies]
psx-hw = { workspace = true }
psx-io = { path = "../psx-io" }
critical-section = { version = "1.2", optional = true, features = ["restore-state-bool"] }

[features]
default = ["runtime"]
# The program image: `_start`, the panic handler, the post-link hazard-trampoline array and
# the PSX-EXE region marker. On by default. A library that wants only the SDK's own services
# (the DMA-safe instruction-cache flush, critical sections, interrupts) inside a program that
# brings its own entry point and panic handler, such as the demo disc's chain-load blob, turns
# it off with `default-features = false`. Features are additive: a program that also links a
# crate asking for the runtime gets it.
runtime = []
# Expose a bump allocator as the global allocator. Kept optional so a
# minimal no-heap homebrew can opt out.
alloc = []
# Debug TTY: `tty::print` and friends store each byte to the Expansion 2 debug
# console (`psx_hw::memory::expansion2::DEBUG_CONSOLE`), where PCSX-Redux, OpenBIOS and our emulator print it to the
# host terminal. Off, they compile to nothing, which is what a shipping build
# wants: no cycles, no port traffic, and no BIOS call either way. Turned on by
# `console-diag`, by emulator-gated test programs (the SDK examples ask for it)
# and by any game build whose gate reads the terminal.
host-tty = []
# Emit coarse boot breadcrumbs through `tty`. Implies `host-tty`: a breadcrumb nobody can see is a trap.
boot-trace = ["host-tty"]
# Keep what the program found in the machine registers when it started, before `entry` set them
# ([`entry::inherited`]): the hardware tests report it to learn what each BIOS leaves. About 120
# bytes of `.bss` and a few dozen register reads at boot; never in a shipping build.
entry-census = []
# Reserve 192 trampoline words instead of 96 (+384 bytes of `.data`).
# The 256-word option takes precedence if both features are enabled.
hazard-trampolines-192 = []
# Reserve 256 trampoline words for the post-link load-delay hazard patcher
# instead of 96 (+640 bytes of `.data`). Opt in only when a guest's linked
# exe reports "trampoline array full".
hazard-trampolines-256 = []
# Guard every `scratchpad::ScratchpadStack::run`: a canary word at the bottom
# of the region, checked after the call, and a trap when interrupts are on
# with an exception handler other than psx-rt's or one the game declared
# with `interrupts::declare_stack_safe_handler`. A few instructions and a
# few RAM loads per call; the build-time proof is stack-guard.
scratchpad-stack-check = []
# The scratchpad stack window (`scratchpad_window`): shared switch, guard and hop routines, the busy word
# and `window_fn!`. Off by default so programs that do not use it are byte-identical; `ScratchpadStack::run`
# only looks at the window state when it is on.
scratchpad-window = []
# Halt on every fault instead of stepping over the faulting instruction:
# a misaligned or bus-erroring load or store stops the program with Cause,
# EPC and BadVAddr recorded, rather than costing one silently wrong value.
# For development and test builds; one `b` in the fault path, nothing on
# the interrupt path.
strict-faults = []
# `present`: the VBlank-kicked present queue, with psx-io's command
# recording and direct-access guard. The handler's kick block costs one load
# per VBlank and is assembled only with this feature.
present-queue = ["psx-io/present-queue"]
# Register psx-rt's interrupt-masking critical section as the
# `critical-section` crate's implementation (for dependencies that use that
# crate). A program links at most one implementation, so this is opt-in.
critical-section = ["dep:critical-section"]
# Stop-panel for diagnostic discs: a fault, a panic or a stall puts the program counter,
# stack, GPU/DMA/CD state and any panic message on screen. See `diag`. Never in a shipping
# build. Also switches on psx-io's counters.
console-diag = ["psx-io/console-diag", "host-tty"]

[lints]
workspace = true
