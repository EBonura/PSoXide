[package]
name         = "psx-settings"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Allocator-free, versioned game preferences and memory-card persistence for PSoXide games."

[dependencies]
psx-mc = { workspace = true, optional = true }
psx-pad = { workspace = true }

[features]
default = ["card"]
card = ["dep:psx-mc"]

[lints]
workspace = true
