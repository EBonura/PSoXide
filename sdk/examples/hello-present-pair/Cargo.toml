# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name    = "hello-present-pair"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hello-present-pair"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-gpu = { path = "../../crates/psx-gpu", features = ["present-queue"] }
psx-rt  = { path = "../../crates/psx-rt", features = ["present-queue"] }
