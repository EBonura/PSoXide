name: CI

# Host-side CI for PSoXide.
#
# Reliability split:
#   - deps (gating): dependency license + source policy via cargo-deny.
#     Verified green locally; it does not depend on toolchain formatting or
#     lint drift, so it is a stable gate.
#   - build-test (advisory): formatting, build, tests, and lint.
#     rust-toolchain.toml pins a dated nightly (since 2026-07-09), so
#     rustfmt/clippy output is reproducible until the pin is bumped --
#     fmt/clippy findings here are real, and the tree was normalized
#     against the pinned rustfmt on 2026-07-11. The job stays
#     continue-on-error so a deliberate pin bump (which may re-drift
#     formatting) never blocks merges mid-transition. Run locally with
#     `make fmt`, `make check`, `make test`, `make lint`.

on:
  push:
  pull_request:

jobs:
  deps:
    name: Dependency policy (gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          # Pinned: this job GATES merges, so its tool must not float.
          # (Unpinned, the 2026-07-11 cargo-deny release changed the
          # `check ... --config` CLI and broke every branch overnight
          # while main sat green from two days earlier.) Bump
          # deliberately, together with the command syntax below.
          tool: cargo-deny@0.19.4
      - name: cargo-deny (licenses + sources, all workspaces)
        run: |
          root="$(git rev-parse --show-toplevel)"
          for ws in . sdk engine; do
            (cd "$ws" && cargo deny --manifest-path Cargo.toml check licenses sources --config "$root/deny.toml")
          done

  build-test:
    name: Build, test, lint (advisory; see workflow notes)
    runs-on: ubuntu-latest
    # Advisory because the repo pins a floating `nightly`: rustfmt/clippy
    # output is not reproducible across nightlies. Do not gate on this until
    # a dated nightly is pinned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install Linux native deps for the desktop frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make pkg-config \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers
      - name: cargo fmt --check (advisory; floating-nightly drift expected)
        run: |
          cargo fmt --all -- --check
          (cd engine && cargo fmt --all -- --check)
          (cd sdk && cargo fmt --all -- --check)
      - name: mfc0 load-delay hazard check (gating; this bug shipped twice)
        run: python3 tools/check_mfc0.py sdk engine emu
      - name: make check
        run: make check
      - name: make test
        run: make test
      - name: make lint
        run: make lint
