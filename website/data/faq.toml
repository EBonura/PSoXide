[[item]]
id = "browser"
group = "playing"
home = true
q = "Can I play it in my browser?"
a = "Yes. The PSoXide player runs the public demo disc on its itch.io page. It requires no installation or BIOS file."
link_text = "Open the browser player"
link = "https://bonnie-studios.itch.io/psoxide"

[[item]]
id = "bios"
group = "emulator"
home = true
q = "Do I need a BIOS?"
a = "No. PSoXide uses its own kernel to boot discs, written from public documentation and black-box observation. It can't load a BIOS at all."
link_text = "How it works"
link = "@/legal.md#no-bios"

[[item]]
id = "compat"
group = "emulator"
home = true
q = "Which commercial games work?"
a = "[[compat_ok]] of the [[compat_total]] games on the compatibility list reach the in-game tier in headless runs, with no BIOS. None has been played through and rated \"playable\" by a person yet."
link_text = "See the list"
link = "@/emulator/compare.md#compatibility"

[[item]]
id = "speed"
group = "emulator"
home = true
q = "How fast is it compared to DuckStation?"
a = "The speed and memory comparison against DuckStation, Beetle PSX and PCSX-Redux is being measured again on a current build. The results will be published on the comparison page with how they were measured, whichever emulator comes out ahead."
link_text = "Full comparison"
link = "@/emulator/compare.md"

[[item]]
id = "legal"
group = "project"
home = true
q = "What licences and permissions apply?"
a = "PSoXide’s SDK, engine, editor and emulator are released under GPL-2.0-or-later, with third-party notices where applicable. Games, music, artwork and other assets may have different terms. The emulator does not require or load a Sony BIOS. Check each project’s licence and distribution notes before reusing or sharing it."
link_text = "Legal & licensing"
link = "@/legal.md"

[[item]]
id = "download"
group = "playing"
home = true
q = "Where do I download the games?"
a = "On itch.io. The PSoXide Demo Disc puts most of them on one image, and several also have their own download."
link_text = "All projects"
link = "@/projects/_index.md"

[[item]]
id = "hardware"
group = "playing"
home = true
q = "What do I need to run it on a real PS1?"
a = "A standard, unmodified retail PlayStation cannot directly boot a burned PSoXide disc. You need a modchipped console or another compatible homebrew boot method. PSoXide does not endorse modchipping or provide installation help. Modifying a console can permanently damage or brick it; any modification is at your own risk."
link_text = "Hardware requirements and warning"
link = "@/legal.md#running-burned-discs-on-original-hardware"

[[item]]
id = "licence"
group = "project"
home = true
q = "Is it open source?"
a = "Yes. The SDK, emulator, editor, engine and most games are GPL-2.0-or-later; the Quake port is GPL-2.0-only."
link_text = "Licences in detail"
link = "@/legal.md#code-and-licences"

[[item]]
id = "ports"
group = "playing"
home = true
q = "Can I play Half-Life or Quake on it?"
a = "Half-Life’s source is public, but Valve has not provided express authorization as of 30 September 2026. It requires your own game data and offers no disc-image download. Counter-Strike and Hollow Knight have no public builds. The Quake port is available, but permission to distribute converted shareware data remains unresolved in this review."
link_text = "Port status and content rights"
link = "@/legal.md#ports-built-from-other-people-s-games"

[[item]]
id = "videos"
group = "playing"
home = true
q = "Where are the videos?"
a = "Watch Bonnie Studios on YouTube for Half-Life, Hollow Knight, Quake, NitroXide and VoXide running on original hardware, plus the browser emulator introduction."
link_text = "Watch the videos"
link = "@/projects/_index.md#videos"

[[item]]
id = "accuracy"
group = "emulator"
q = "How accurate is it?"
a = "A cross-emulator accuracy comparison is not available yet. PSoXide is tested against a real console using a hardware test battery, with documented differences and reproduction steps."
link_text = "Accuracy section"
link = "@/emulator/compare.md#accuracy"

[[item]]
id = "platforms"
group = "emulator"
q = "What does the emulator run on?"
a = "It builds from source as a desktop app (the README lists the extra packages Ubuntu needs), and it has a browser build, which is the player on itch.io."
link_text = "Emulator README"
link = "https://github.com/EBonura/PSoXide-emulator"

[[item]]
id = "build-emulator"
group = "emulator"
q = "How do I build the emulator?"
a = """
```sh
git clone https://github.com/EBonura/PSoXide-emulator.git
cd PSoXide-emulator
make bootstrap
make build
./target/release/frontend
```
You need Rust through rustup, Python 3 and your host's C/C++ build tools."""
link_text = "Emulator README"
link = "https://github.com/EBonura/PSoXide-emulator"

[[item]]
id = "first-program"
group = "making"
q = "How do I build my first PS1 program?"
a = "Clone the SDK and run `make hello-tri-disc`. You get a bootable BIN/CUE with one shaded triangle. The walkthrough covers the tools you need and how to run it."
link_text = "The walkthrough"
link = "@/docs/first-ps1-program.md"

[[item]]
id = "editor"
group = "making"
q = "Do I have to write bare-metal code?"
a = "No. You can write bare-metal Rust against the SDK, or build scenes in the editor and let the engine and cooker turn them into a disc. Cortex Ignition is made that way."
link_text = "The editor"
link = "https://github.com/EBonura/PSoXide-editor"

[[item]]
id = "repos"
group = "making"
q = "Which repository do I need?"
a = "The SDK is EBonura/PSoXide, the emulator EBonura/PSoXide-emulator, and the editor, engine and Cortex Ignition EBonura/PSoXide-editor. The editor and emulator pin their source dependencies, and `make bootstrap` fetches them. The SDK builds independently."
link_text = "The SDK"
link = "https://github.com/EBonura/PSoXide"

[[item]]
id = "own-game"
group = "project"
q = "Can I release my own game made with it?"
a = "Using the tools does not automatically license their output under the GPL. Distributing a program incorporating or linking PSoXide’s GPL runtime or SDK generally requires GPL-compatible licensing of the combined program and complete corresponding source, including required build material. Independent art, music and other content keep their own terms; bundled demo assets may not be reusable in your release."
link_text = "Releasing games made with PSoXide"
link = "@/legal.md#code-and-licences"

[[item]]
id = "contribute"
group = "project"
q = "How do I report a bug or contribute?"
a = "Open an issue on the repository it's about: [the SDK or this website](https://github.com/EBonura/PSoXide/issues), [the emulator](https://github.com/EBonura/PSoXide-emulator/issues), or [the editor and engine](https://github.com/EBonura/PSoXide-editor/issues). For a change to the emulator, run `make check`, `make test` and `make fmt-check`, add a focused regression test, and say whether your evidence comes from emulation or real hardware. Never commit BIOS files or game images."
link_text = "Contributing guide"
link = "https://github.com/EBonura/PSoXide-emulator/blob/main/CONTRIBUTING.md"
