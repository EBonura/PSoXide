[package]
name = "frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `editor` (default) compiles the full host editor workspace into the
# frontend: the embedded 3D preview, the in-editor Play viewport, and the
# project/disc authoring CLI. Building with `--no-default-features` drops the
# psxed-* dependencies and every editor reference, leaving an emulator-only
# binary (the target for a future web/wasm build).
default = ["editor"]
editor = ["dep:psxed-ui", "dep:psxed-project"]

[dependencies]
emulator-core    = { workspace = true }
psoxide-settings = { workspace = true }
psoxide-validation = { workspace = true }
psx-asset        = { workspace = true }
psx-engine       = { workspace = true }
psx-gpu          = { workspace = true }
psx-gpu-render   = { workspace = true }
psx-gte          = { workspace = true }
psx-vram         = { workspace = true }
psx-iso          = { workspace = true }
psx-trace        = { workspace = true }
psxed-project    = { workspace = true, optional = true }
psxed-ui         = { workspace = true, optional = true }

clap       = { workspace = true }
winit      = { workspace = true }
wgpu       = { workspace = true }
egui       = { workspace = true }
egui-wgpu  = { workspace = true }
# Declared directly (not `workspace = true`) so `default-features = false`
# actually applies: the workspace default pulls egui-winit's `clipboard`
# feature, which drags in `arboard`, and `arboard` has no wasm32 backend.
# Native re-adds `clipboard`/`wayland`/`x11` in its target table below; the
# cross-platform base keeps only `links` (URL open via `webbrowser`). Version
# kept in lockstep with the workspace's `egui-winit = "0.31"`.
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
image      = { workspace = true }
pollster   = { workspace = true }
# Drop-in `std::time::Instant`/`SystemTime` replacement: re-exports `std` on
# native, uses the browser performance clock on wasm where `std`'s clock panics.
web-time   = "1.1"

# `gilrs` (gamepads) and `rfd` (native file dialogs) have no wasm32 backend, so
# the wasm frontend uses keyboard-only input and skips the file dialogs. `cpal`
# builds on both: native host audio here, WebAudio backend in the wasm table.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal  = { workspace = true }
gilrs = { workspace = true }
rfd   = { workspace = true }
egui-winit = { version = "0.31", default-features = false, features = ["links", "clipboard", "wayland", "x11"] }

# Browser entry points: canvas + document access, async GPU init, and a panic
# hook that forwards Rust panics to the devtools console. `wgpu`'s `webgl`
# feature compiles its WebGL2 backend so the surface can come from a canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# cpal's WebAudio backend (main-thread ScriptProcessor callback): single
# threaded, no SharedArrayBuffer. Browsers suspend audio until a user gesture.
cpal = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Navigator", "Gamepad", "GamepadButton"] }
js-sys = "0.3"
wgpu = { workspace = true, features = ["webgl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
