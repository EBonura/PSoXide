[workspace]
resolver = "2"
members = ["crates/psx-anim-cook", "crates/psx-anim-tracks", "crates/psx-disasm", "crates/psx-audio-cook", "crates/psx-seq-cook", "crates/psx-hw", "crates/psx-iso", "crates/psx-library", "crates/psx-trace", "crates/psxed-format", "crates/psxed", "crates/psxed-audio", "crates/psxed-gltf", "crates/psxed-obj", "crates/psxed-project", "crates/psxed-tex", "tools/mkisopsx", "tools/psoxide-dev", "tools/psoxide-hwtest", "tools/psoxide-perf", "tools/psoxide-hazard", "tools/psoxide-link", "tools/psoxide-pgo", "tools/psoxide-size", "tools/xtask"]
exclude = ["sdk", "engine", "build"]

[workspace.package]
edition = "2021"
# Host tooling floor; device builds use the pinned nightly.
rust-version = "1.87"
license = "GPL-2.0-or-later"
repository = "https://github.com/EBonura/PSoXide"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "allow"

# Google's Rust style guide (sdk/docs/STYLE.md). Clean today, so denied; `make lint`
# runs clippy with -D warnings.
wrong_self_convention = "deny"
should_implement_trait = "deny"
len_without_is_empty = "deny"
borrowed_box = "deny"
ptr_arg = "deny"
new_without_default = "deny"
new_ret_no_self = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_unwrap = "deny"
from_over_into = "deny"
inherent_to_string = "deny"
enum_glob_use = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
get_first = "deny"

# Not clean yet. Allowed here so -D warnings stays green, counted by
# tools/style-ratchet.sh against tools/style-ratchet.baseline: a count may fall,
# never rise. `tools/style-ratchet.sh --report` shows today's numbers.
must_use_candidate = "allow"
unwrap_used = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
string_add = "allow"
string_add_assign = "allow"
fn_params_excessive_bools = "allow"
needless_for_each = "allow"

[workspace.dependencies]
bitflags = { version = "2.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
image = { version = "0.25", default-features = false, features = ["png"] }
psx-asset = { path = "sdk/crates/psx-asset" }
psxed-format = { path = "crates/psxed-format" }
psxed-audio = { path = "crates/psxed-audio" }
psxed-gltf = { path = "crates/psxed-gltf" }
psxed-obj = { path = "crates/psxed-obj" }
psxed-tex = { path = "crates/psxed-tex" }

[profile.release]
lto = "fat"
codegen-units = 1
