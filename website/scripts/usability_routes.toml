# Questions real visitors ask, and where the site answers them.
# Each route is a list of [page, selector] steps: every step but the last is a
# link to click, the last is the answer. A page with "#fragment" means the link
# opened the page at that anchor. Selectors are CSS, or "text=Start of text"
# for the first visible heading/link/paragraph starting with that text.
# "before" = the first prototype (commit 50226bf); "after" = the current site.
# Run: python3 scripts/usability_check.py --set after

[[q]]
id = "browser"
audience = "Player"
question = "Can I play it in my browser?"
before = [[["/", "a.nav-play"]]]
after = [[["/", "a.nav-play"]]]

[[q]]
id = "games"
audience = "Player"
question = "What games are there?"
before = [[["/", "text=Original games, built for the real hardware"]], [["/", ".nav a[href*='/projects']"], ["/projects/", "text=Original work"]]]
after = [[["/", ".nav a[href*='/projects']"], ["/projects/", "text=Games, tools and collections"]], [["/", "#made-with"]]]

