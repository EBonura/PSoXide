# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name    = "hello-called"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hello-called"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-gpu = { path = "../../crates/psx-gpu" }
psx-hw  = { path = "../../../crates/psx-hw" }
psx-io  = { path = "../../crates/psx-io" }
psx-rt  = { path = "../../crates/psx-rt", features = ["host-tty"] }

[features]
# The called program (link with blob.ld): psx-rt's `called-program`, so its `_start` returns to
# its caller and leaves the caller's VRAM, display and CD mixer alone. Without it: the caller,
# which embeds the blob's EXE (HELLO_CALLED_BLOB at build time).
blob = ["psx-rt/called-program"]
