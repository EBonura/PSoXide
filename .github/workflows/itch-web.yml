name: Build and deploy the web player to itch.io

on:
  pull_request:
    paths:
      - ".github/actions/itch-publish/**"
      - ".github/workflows/itch-web.yml"
      - "emu/**"
      - "tools/verify-web-dist.py"
      - "tools/test_verify_web_dist.py"
      - "Makefile"
      - "VERSION"
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after building and validating the web bundle
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: itch-psoxide-html5
  cancel-in-progress: false

jobs:
  web:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve the web version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < VERSION)"
          [[ "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain a plain semantic version" >&2
            exit 1
          }
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${base_version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match VERSION ${base_version}" >&2
              exit 1
            }
            version="${base_version}"
          else
            version="${base_version}-dev.$(git rev-parse --short=8 HEAD)"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install the pinned Rust toolchain and wasm target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install Trunk 0.21.14
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: trunk@0.21.14

      - name: Test the public-disc delivery guard
        run: python3 -m unittest tools/test_verify_web_dist.py

      - name: Build and stage the complete web player
        env:
          GH_TOKEN: ${{ github.token }}
        run: make web-bundle

      - name: Retain the verified web package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psoxide-html5-${{ steps.version.outputs.value }}
          path: emu/crates/frontend/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Validate destination and optionally publish
        uses: ./.github/actions/itch-publish
        with:
          source-dir: emu/crates/frontend/dist
          target: bonnie-studios/psoxide:html5
          user-version: ${{ steps.version.outputs.value }}
          publish: >-
            ${{ github.ref_type == 'tag' ||
                inputs.publish ||
                (github.event_name == 'workflow_run' &&
                 vars.ITCH_WEB_AUTO_PUBLISH == 'true') }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
