[package]
name = "psx-vector-cook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host cooker: an SVG subset to the PSVG vector asset the psx-vector runtime draws."

[lints]
workspace = true

[dependencies]
psx-vector = { path = "../psx-vector", features = ["encode"] }
psx-gpu = { path = "../../../sdk/crates/psx-gpu" }

[[bin]]
name = "psx-svg-cook"
path = "src/main.rs"
