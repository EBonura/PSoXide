# `trim-paths` is a nightly cargo feature; these crates are nightly-pinned
# anyway (bare-metal MIPS needs build-std), so the gate costs nothing.
cargo-features = ["trim-paths"]

[package]
name    = "game-breakout"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "game-breakout"
path = "src/main.rs"

[profile.release]
# Keep absolute host paths out of the shipped binary. rustc records the
# source path of every panic/assert site (core::panic::Location) as a
# string in .rodata, which on the PS1 means the developer's home directory
# occupies console RAM and ships on the public disc image.
trim-paths    = "all"
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-engine = { path = "../../crates/psx-engine" }
psx-font   = { path = "../../../sdk/crates/psx-font" }
psx-fx     = { path = "../../../sdk/crates/psx-fx" }
psx-gpu    = { path = "../../../sdk/crates/psx-gpu" }
psx-rt     = { path = "../../../sdk/crates/psx-rt" }
psx-settings = { path = "../../../sdk/crates/psx-settings" }
psx-spu    = { path = "../../../sdk/crates/psx-spu" }
psx-vram   = { path = "../../../sdk/crates/psx-vram" }
