[package]
name    = "psx-game-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PSoXide game layer: streaming/residency/VRAM policy and (in later phases) the entity/combat/AI runtime, between psx-engine's primitives and a game. See docs/game-runtime-plan.md."

[features]
# Streamed-world build shape (editor-playtest's default, which forwards
# it): room-surface materials pool by resident stream slot instead of
# living inline in `ActiveRuntimeRoom`.
cd-stream-bench = []
# CD throughput probe (`cd_stream::run_benchmark`). Declared here since
# phase 1.5: the module carried its `cd-stream-benchmark` cfgs from the
# example verbatim in the phase-1 carve, but the crate never declared
# the feature, so the probe silently compiled out (and every cfg warned)
# until the game's own feature forwarded it again.
cd-stream-benchmark = ["cd-stream-bench"]
# Grid-visibility build shape + its algorithm-variant toggles, declared
# here since the phase-2 visible-cell carve so the moved policy keeps
# compiling to the exact same shape the example selects (the example
# forwards each of these from its own feature of the same name).
world-grid-visible = []
vis-full-active-chunks = []
vis-anchor-cache = []
vis-anchor-pvs-candidates = []
vis-coarse-yaw = []
vis-broad-pvs = []
# Immediate-mode actor collision cylinders. Keep this out of shipping builds:
# the helper is intentionally explicit and sizeable on MIPS, and is only useful
# while tuning authored collision bounds.
collision-debug-overlay = []

[dependencies]
# Explicit paths, same rationale as psx-engine: resolvable when
# consumed from outside the engine workspace.
psx-asset     = { path = "../../../sdk/crates/psx-asset" }
psx-engine    = { path = "../psx-engine" }
psx-font      = { path = "../../../sdk/crates/psx-font" }
psx-gpu       = { path = "../../../sdk/crates/psx-gpu" }
psx-level     = { path = "../psx-level" }
psx-hw        = { path = "../../../crates/psx-hw" }
psx-io        = { path = "../../../sdk/crates/psx-io" }
psx-math      = { path = "../../../sdk/crates/psx-math" }
psx-telemetry = { path = "../../../sdk/crates/psx-telemetry" }
psx-vram      = { path = "../../../sdk/crates/psx-vram" }

[lints]
workspace = true
