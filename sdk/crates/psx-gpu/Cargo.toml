[package]
name         = "psx-gpu"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "High-level PS1 GPU API: init, primitives, framebuffers."

[dependencies]
bitflags = { version = "2.6", default-features = false }
psx-hw = { workspace = true }
psx-io = { path = "../psx-io" }

[features]
default = []
# Hand-scheduled R3000 kernels for the ordering-table link passes
# (`asm_kernels.rs`), used instead of the inline-asm loops in `ot.rs`.
# Off by default; bit-identical to them, faster on the cycle model.
asm-kernels = []

[lints]
workspace = true
