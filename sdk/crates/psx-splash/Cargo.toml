[package]
name         = "psx-splash"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "The boot splash every PSoXide game opens with: the Bonnie Studios mark and a line of text with a sweeping sheen (\"Built with PSoXide\"), faded in, held and faded out. One call, no heap, nothing linked unless it is called."

[dependencies]
psx-display = { workspace = true }
psx-font    = { workspace = true }
psx-gpu     = { workspace = true }
psx-pad     = { workspace = true }
psx-rt      = { workspace = true }
psx-vram    = { workspace = true }

[lints]
workspace = true
