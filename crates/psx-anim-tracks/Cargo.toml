[package]
name = "psx-anim-tracks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side encoder for version 6 .psxanim keyed-track clips: smallest-three quaternion and variable-bit translation keys with per-joint key counts, fitted against a vertex-space error bound with the exact runtime decoder in psx_asset::tracks."

