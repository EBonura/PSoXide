[package]
name         = "psx-seq"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Sequenced music on the PS1 SPU: a three-level script interpreter (sequence, channel, layer), software envelopes, vibrato and portamento, and a note allocator, over psx-sfx's hardware seam. No heap, no float, no 64-bit arithmetic."

[dependencies]
psx-spu = { path = "../psx-spu" }
psx-sfx = { path = "../psx-sfx" }

[lints]
workspace = true
