[package]
name         = "psx-splash"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "The boot splash every PSoXide game opens with: the Bonnie Studios mark and a line of text with a sweeping sheen (\"Built with PSoXide\"), faded in, held and faded out. One call, no heap, nothing linked unless it is called."

[dependencies]
psx-display = { workspace = true }
psx-font    = { workspace = true }
psx-gpu     = { workspace = true }
psx-pad     = { workspace = true }
psx-rt      = { workspace = true }
psx-vram    = { workspace = true }

[features]
# For a program that links the splash into a boot-only overlay module: `play` and the mark's
# decoder take their callbacks by type, not as trait objects, so no vtable for a closure of the
# splash lands in the program's resident read-only data pointing into the module's code. Costs
# code size (a generic copy is built in the caller's crate); off by default, and a program
# without it links the splash exactly as before.
overlay = []

[lints]
workspace = true
