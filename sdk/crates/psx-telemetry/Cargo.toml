[package]
name         = "psx-telemetry"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Shared guest/host telemetry id tables plus the guest-side event emitters."

[dependencies]
psx-hw = { workspace = true }

[features]
# Compile the Expansion 2 MMIO writes in `emit`. Games forward their own
# telemetry feature here (emulator-telemetry = ["psx-telemetry/emit"]); with
# it off every emitter compiles to a no-op, so shipping builds pay nothing.
emit = []
# The result receipts a headless journey reads back from a game's RAM (`receipts!`). A development
# tap: the gate disc builds with it, a shipping disc has none of them.
receipts = []

[lints]
workspace = true
