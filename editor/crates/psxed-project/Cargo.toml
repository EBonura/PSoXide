[package]
name = "psxed-project"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/EBonura/PSoXide"
description = "PSoXide editor project model: scenes, nodes, resources, and PS1-facing authoring metadata."

[dependencies]
psxed-format = { path = "../psxed-format" }
psxed-audio  = { path = "../psxed-audio" }
psxed-gltf   = { path = "../psxed-gltf" }
psxed-tex    = { path = "../psxed-tex" }
psx-asset    = { path = "../../../sdk/crates/psx-asset" }
psx-bsp      = { path = "../../../engine/crates/psx-bsp" }
psx-engine   = { path = "../../../engine/crates/psx-engine" }
psx-iso      = { path = "../../../crates/psx-iso" }
psx-level    = { path = "../../../engine/crates/psx-level" }
flate2 = "1.1"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "cook-playtest"
path = "src/bin/cook_playtest.rs"

[[bin]]
name = "gen-prefab-gallery"
path = "src/bin/gen_prefab_gallery.rs"

[[bin]]
name = "prefab-sheet"
path = "src/bin/prefab_sheet.rs"

[[bin]]
name = "gen-prefab-kit"
path = "src/bin/gen_prefab_kit.rs"

[[bin]]
name = "gen-stress-map"
path = "src/bin/gen_stress_map.rs"

[[bin]]
name = "miniaturise-project"
path = "src/bin/miniaturise_project.rs"

[[bin]]
name = "import-locomotion"
path = "src/bin/import_locomotion.rs"
