[package]
name         = "psx-io"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Volatile MMIO primitives for PSoXide target code."

[dependencies]
psx-hw = { workspace = true }

[lints]
workspace = true

[features]
default = []
# No effect: command recording and the direct-access guard (`gpu::start_recording_raw`,
# `gpu::arm_direct_access_guard`) are part of every build. Kept so a manifest that still names it
# resolves; it goes with the old present entry points.
present-queue = []
# Counters and wait-site records a stop-panel can print (see `diag`). Off in every
# shipping build; every hook compiles to nothing without it.
console-diag = []
