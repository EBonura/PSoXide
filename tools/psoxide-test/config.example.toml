# psoxide-test user config: ~/.config/psoxide-test/config.toml, or point PSOXIDE_TEST_CONFIG at a
# copy. Machine-local and never committed. Every path below is a placeholder.

# Receipts, logs, results and adapter evidence, one directory per game under here.
work = "/path/to/psoxide-test-work"
# The games library the install stage writes to (one directory per game).
library = "/path/to/ps1-games"

[budget]
jobs = 3        # CARGO_BUILD_JOBS for builds
emulators = 2   # emulator processes at once (gate, psoxide-pgo replays, ReARMed)
redux = 1       # PCSX-Redux processes at once
# One directory every harness run on the machine shares (lock files only): emulator and Redux
# jobs then also hold one of machine_emulators / machine_redux slots, across all runs together.
# shared_dir = "/path/to/psoxide-test-slots"
# machine_emulators = 4
# machine_redux = 1
# The full tier runs clean beside the other stages unless jobs is 1 or the work tree has less free
# disk than this, in GB; then it runs last, as before.
# overlap_min_free_gb = 9

[tools]
# The PSoXide frontend that `psoxide-pgo measure` replays tapes on.
frontend = "/path/to/PSoXide-emulator/target/pgo/release/frontend"
# The PCSX-ReARMed libretro core.
rearmed_core = "/path/to/pcsx_rearmed_libretro.dylib"
# The official PCSX-Redux bundle's Contents directory (run windowless, never the installed app).
redux = "/path/to/PCSX-Redux.app/Contents"

[tools.gate]
# psoxide-gate and the PSoXide-emulator revision it was built from; the harness refuses any other.
path = "/path/to/psoxide-gate"
revision = "97cd078f"

# Original game files a build needs, by the name its psoxide-test.toml uses in `{input:NAME}`.
[inputs]
# original-disc = "/path/to/the/original/game/files"
