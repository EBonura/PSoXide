# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name    = "hello-core-overlay"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hello-core-overlay"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-core = { path = "../../crates/psx-core", features = ["link"] }
psx-rt   = { path = "../../crates/psx-rt", features = ["host-tty"] }

[features]
# The overlay runs over a static host buffer (`.bss.overlay_host`) instead of at OVERLAY_VMA:
# link with ram-host.ld.
host = []
# With `host`: boot-only memory as well (psoxide-boot.ld), the shape of a program with the core,
# a `.boot` section and a host (Counter-Strike). The host must start at `.data`'s end, over the
# boot-only store and the stored core, and the link must converge without BOOT_VMA_OVERRIDE.
boot = ["host"]
