[package]
name = "emulator-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PSoXide emulator core: CPU, bus, and peripherals. No UI, no window -- pure state machine."

[dependencies]
psx-hw       = { workspace = true }
psx-iso      = { workspace = true }
psx-trace    = { workspace = true }
# "serde" enables Gte's Serialize/Deserialize derive -- off by default in
# psx-gte-core itself so the no_std SDK build never pulls serde in.
psx-gte-core = { workspace = true, features = ["serde"] }
psx-telemetry = { workspace = true }
thiserror    = { workspace = true }
serde        = { workspace = true, features = ["std"] }
serde_bytes  = { workspace = true }

[dev-dependencies]
psx-spu = { path = "../../../sdk/crates/psx-spu" }
psoxide-settings = { workspace = true }
# GPU packet structs (TriTexturedGouraud / QuadTexturedGouraud) so the
# rasterizer tests can feed the *exact* bytes the engine emits, rather
# than hand-assembled GP0 words. Acyclic: psx-gpu only depends on psx-hw.
psx-gpu = { workspace = true }

[features]
default = []
# Record every MMIO read/write in a bounded ring buffer on the Bus.
# Off by default -- see `mmio_trace.rs` for why it's compile-time gated.
trace-mmio = []
# Snapshot all 64 GTE registers into every InstructionRecord. Required
# by the parity tests, ~zero-cost when off (snapshot fn returns zeros
# and gets inlined out). Leaving this on in `make run` regresses CPU
# perf by ~30% -- caught when the frontend got slow after this snapshot
# work landed.
trace-cop2 = []

[lints.rust]
missing_docs = "warn"
