# `trim-paths` is a nightly cargo feature; these crates are nightly-pinned anyway (bare-metal MIPS
# needs build-std). It keeps the checkout path out of the panic locations in .rodata.
cargo-features = ["trim-paths"]

[package]
name    = "showcase-text"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "showcase-text"
path = "src/main.rs"

[profile.release]
trim-paths = "all"
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-engine = { path = "../../crates/psx-engine" }
psx-font   = { path = "../../../sdk/crates/psx-font" }
psx-rt     = { path = "../../../sdk/crates/psx-rt" }
psx-vram   = { path = "../../../sdk/crates/psx-vram" }
