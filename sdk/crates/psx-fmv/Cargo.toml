[package]
name         = "psx-fmv"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "FMV playback building blocks: STR sector demux, BS v2 bitstream to MDEC run-length decode, MDEC upload/decode via DMA0/DMA1, ISO9660 root-file lookup."

[dependencies]
# The bitstream, STR and ISO parsers are pure logic and build for guest and
# host alike (host `cargo test` covers them). The MDEC driver touches MMIO
# only when one of its methods runs, so it builds on the host as well and its
# ownership tests run there.
psx-hw = { workspace = true }
psx-io = { workspace = true }
# The streaming player (`player`) drives the drive, the display and the SPU.
psx-gpu = { workspace = true }
psx-pack = { workspace = true }
psx-rt = { workspace = true }
psx-spu = { workspace = true }
psx-vram = { workspace = true }

[lints]
workspace = true
