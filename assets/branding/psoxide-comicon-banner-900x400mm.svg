<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900mm" height="400mm" viewBox="0 0 900 400"
     role="img" aria-label="PSoXide Comic Con banner">
  <!-- Finished size: 900 x 400 mm. Add bleed only after receiving the printer's template. -->
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11171d"/>
      <stop offset="57%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#05080b"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="48%" cy="38%" r="63%">
      <stop offset="0%" stop-color="#00c4ec" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#00bfe6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00bfe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d25"/>
      <stop offset="100%" stop-color="#091017"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.45" result="colour"/>
      <feComposite in="colour" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bannerClip"><rect width="900" height="400" rx="5"/></clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="900" height="400" fill="url(#bannerBg)"/>
    <ellipse cx="396" cy="148" rx="390" ry="235" fill="url(#bannerGlow)"/>

    <!-- PS1-inspired perspective floor. -->
    <g opacity="0.96">
      <path d="M0 287 H900 M0 306 H900 M0 330 H900 M0 361 H900 M0 399 H900"
            fill="none" stroke="#25313c" stroke-width="1.2" stroke-opacity="0.78"/>
      <path d="M126 282 L-120 400 M226 282 L80 400 M326 282 L280 400
               M426 282 L480 400 M526 282 L680 400 M626 282 L880 400
               M726 282 L1080 400"
            fill="none" stroke="#172731" stroke-width="1.2" stroke-opacity="0.95"/>
      <path d="M0 286 H900" fill="none" stroke="#00c4ec" stroke-width="1.3" stroke-opacity="0.18"/>
    </g>

    <!-- Left brand and proposition. -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="52" y="48" fill="#8e9aa8" font-size="11" font-weight="700" letter-spacing="3.2">
        BONNIE <tspan fill="#dbe4ec">STUDIOS</tspan>
      </text>
      <rect x="52" y="60" width="31" height="2" rx="1" fill="#00c4ec"/>

      <!-- The original PSoXide lockup stands alone. Its visible edge aligns at x=54. -->
      <image x="2" y="60" width="540" height="140.4"
             href="psoxide-logo.svg" xlink:href="psoxide-logo.svg"
             preserveAspectRatio="xMidYMid meet"/>

      <text x="54" y="238" fill="#ffffff" font-size="23.5" font-weight="750" letter-spacing="0.78">
        CREA GIOCHI PER PLAYSTATION 1
      </text>

      <text x="55" y="270" fill="#9aa8b6" font-size="11.5" letter-spacing="1.15">
        PROVALO SUBITO, NEL BROWSER O SULLA CONSOLE ORIGINALE
      </text>

      <g font-size="8.8" font-weight="750" letter-spacing="0.82">
        <g transform="translate(54 301)">
          <rect width="188" height="31" rx="15.5" fill="#00c4ec"/>
          <text x="94" y="19.5" text-anchor="middle" fill="#061017">GIOCA ORA NEL BROWSER</text>
        </g>
        <g transform="translate(254 301)">
          <rect width="218" height="31" rx="15.5" fill="#0f1a22" stroke="#00c4ec" stroke-opacity="0.62" stroke-width="1.2"/>
          <text x="109" y="19.5" text-anchor="middle" fill="#dbe4ec">MASTERIZZA E GIOCA SU PS1</text>
        </g>
      </g>
    </g>

    <!-- Cyan divider keeps the scan action visually independent. -->
    <path d="M618 48 V351" stroke="#00c4ec" stroke-width="1.2" stroke-opacity="0.24"/>
    <circle cx="618" cy="48" r="2.4" fill="#00c4ec"/>
    <circle cx="618" cy="351" r="2.4" fill="#00c4ec"/>

    <!-- QR call-to-action card. QR is kept black-on-white and unobstructed. -->
    <g filter="url(#cardShadow)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <rect x="654" y="42" width="200" height="302" rx="20" fill="url(#cardFill)"
            stroke="#00c4ec" stroke-opacity="0.28" stroke-width="1.4"/>
      <rect x="671" y="59" width="166" height="166" rx="11" fill="#ffffff"/>
      <image x="676" y="64" width="156" height="156"
             href="bonnie-studios-qr.svg" xlink:href="bonnie-studios-qr.svg"
             preserveAspectRatio="xMidYMid meet"/>

      <text x="754" y="258" text-anchor="middle" fill="#ffffff"
            font-size="15.8" font-weight="750" letter-spacing="0.95">INQUADRA E GIOCA</text>
      <text x="754" y="282" text-anchor="middle" fill="#00c4ec"
            font-size="8.8" font-weight="700" letter-spacing="1.18">BROWSER · DEMO DISC · PS1</text>
      <path d="M687 300 H821" stroke="#25313c" stroke-width="1"/>
      <text x="754" y="322" text-anchor="middle" fill="#9aa8b6"
            font-size="8.1" letter-spacing="0.25">allmylinks.com/bonniestudiosdev</text>
    </g>
  </g>
</svg>
