[package]
name = "psx-goldsrc"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
psx-asset = { path = "../../../sdk/crates/psx-asset" }
psx-sfx = { path = "../../../sdk/crates/psx-sfx" }
psx-spu = { path = "../../../sdk/crates/psx-spu" }
psx-pack = { path = "../../../sdk/crates/psx-pack" }
psx-gpu = { path = "../../../sdk/crates/psx-gpu" }
psx-io = { path = "../../../sdk/crates/psx-io" }
psx-math = { path = "../../../sdk/crates/psx-math" }
psx-telemetry = { path = "../../../sdk/crates/psx-telemetry" }
psx-engine = { path = "../psx-engine" }

[features]
# `telemetry` writes PSoXide's guest event ports only when a port enables one of
# these through its own feature of the same name; otherwise every hook compiles
# to nothing.
emulator-telemetry = []
performance-telemetry = []
# Measurement builds only: announce every CPU-projected vertex (screen word +
# view depth) to PSoXide's texture-warp probe through its emulator-only port,
# so `frontend launch --warp-log` can score soft-projected geometry too.
# Retail hardware ignores the writes; shipping builds compile them out.
warp-probe = []
