name: Audit itch.io deployment contracts

on:
  schedule:
    - cron: "17 08 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit every registered public workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/audit-itch-deployments.py
