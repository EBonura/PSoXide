# The architecture gate's allow-list for the SDK (the rules and the design are in sdk/docs/GATE.md).
#
# A guest build that enables a feature below nowhere, writes a hardware register address,
# installs an exception-vector handler, runs COP0 assembly, calls a deprecated entry point or
# carries a private copy of an SDK crate stops, unless an exception names exactly that. The
# exceptions of a program that lives in this repository are the [[exception]] entries at the end
# of this file; the exceptions of any other program are in that program's own `psx-gate.toml`,
# which this file never names. Both are ratchets: nothing is added, an entry that no longer
# matches the tree fails the build too (delete it), and a count only goes down. Every entry's
# `remove` is a short tag: a workstream (W3), `unscheduled` or `decision`.

# Features any guest build may enable.
[shipping]
psx-rt   = ["runtime", "hazard-trampolines-192", "hazard-trampolines-256"]
psx-mc   = ["hw"]
psx-settings = ["card"]

# Development taps. A build with one of these on is a diagnostic build: it runs, it cannot
# become a disc without --diag (the receipt psoxide-pgo apply writes says so).
[diag]
psx-rt   = ["host-tty", "boot-trace", "entry-census", "scratchpad-stack-check", "strict-faults", "console-diag"]
psx-io   = ["console-diag"]
psx-telemetry = ["emit"]
psx-cdstream  = ["trace"]
psx-engine    = ["boot-trace", "emulator-telemetry", "debug-log", "hardware-boot-visual", "room-surface-profile", "vert-debug"]
psx-game-runtime = ["cd-stream-benchmark", "collision-debug-overlay", "panel-meter"]
psx-goldsrc   = ["emulator-telemetry", "performance-telemetry", "warp-probe"]

# Host-only models and encoders; the build scripts do not check host builds, and a guest build
# that enables one is refused.
[host]
psx-grid     = ["std"]
psx-vector   = ["encode"]
psx-gte-core = ["serde"]
psxed-audio  = ["pack"]

# Programs of this repository that measure the hardware and so must not depend on the accessors
# they measure: exempt from the register-literal, vector-write and COP0 rules (their features,
# private copies and deprecated calls are still checked).
[probe]
programs = ["hardware-tests"]

# Legacy entry points that a program may still call only while its exceptions list the call.
[deprecated]
symbols = ["poll_port1", "PadReader", "poll_on"]

