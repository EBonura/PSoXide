[package]
name    = "hardware-tests"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "hardware-tests"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
# Default opt-level on purpose. The suite outgrew its boot-EXE budget when
# SB2 landed, and building for size looked like the cheap way out: "z"
# crashes rustc (LLVM ShrinkWrap, MIPS-I), and "s" BUILT but produced a
# binary that never reached its menu. A silently miscompiled hardware test
# suite is the worst possible trade, so the room came from shrinking the
# CDTEST region instead (600 -> 500 sectors, Makefile plus the two probes
# that name its LBA).

[dependencies]
psx-engine = { path = "../../crates/psx-engine" }
psx-asset  = { path = "../../../sdk/crates/psx-asset" }
psx-font   = { path = "../../../sdk/crates/psx-font" }
psx-gpu    = { path = "../../../sdk/crates/psx-gpu" }
psx-gte    = { path = "../../../sdk/crates/psx-gte" }
psx-io     = { path = "../../../sdk/crates/psx-io" }
psx-pack   = { path = "../../../sdk/crates/psx-pack" }
psx-pad    = { path = "../../../sdk/crates/psx-pad" }
psx-rt     = { path = "../../../sdk/crates/psx-rt" }
psx-spu    = { path = "../../../sdk/crates/psx-spu" }
psx-vram   = { path = "../../../sdk/crates/psx-vram" }
hello-memcard-recovery = { package = "hello-memcard", path = "../../../sdk/examples/hello-memcard" }
qrcodegen-no-heap = "1.8.1"
