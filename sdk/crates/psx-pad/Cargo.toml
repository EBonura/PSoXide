[package]
name         = "psx-pad"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "SIO0 controller polling: digital and DualShock analog pads, plus diagnostic pacing knobs."

[features]
# Per-port counters in `Controllers` (polls, failed, first-try failed, handshakes) for test
# instruments. Off in every game: it adds code and state to the poll.
counters = []

[dependencies]
psx-hw = { workspace = true }
psx-io = { path = "../psx-io" }
psx-math = { path = "../psx-math" }

[lints]
workspace = true
