[package]
name    = "sfxbench"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "sfxbench"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-hw   = { path = "../../../crates/psx-hw" }
psx-math = { path = "../../crates/psx-math" }
psx-rt   = { path = "../../crates/psx-rt" }
psx-sfx  = { path = "../../crates/psx-sfx" }
psx-spu  = { path = "../../crates/psx-spu" }
