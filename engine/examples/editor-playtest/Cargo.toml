[package]
name    = "editor-playtest"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "editor-playtest"
path = "src/main.rs"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true

[features]
default = [
    "cd-stream-bench",
    # Bucketed = OT-as-radix-sort, no per-frame comparison sort. The exact
    # intra-slot ordering modes (slot/global/linked) cost 122k-313k extra
    # cycles per render vblank for no observed visual difference; see
    # docs/perf-30fps.md experiment 2.
    "world-order-bucketed",
    "world-grid-visible",
    "ot-2048",
    # Camera-independent visible-cell fills: the cached candidate list
    # per (room, anchor) holds the full PVS set and per-frame camera
    # culling happens downstream in cell_select/surface tests, so
    # camera rotation no longer refills every drawn room each tick
    # (was 33k avg / 184k spike ticks on the benchmark tape).
    "vis-anchor-pvs-candidates",
    # Fixed 3x3 one-level TR subdivision lattice. The Cortex v1 A/B reduced
    # matched room-surface work by 15.5% with bit-identical leaf packets.
    "tr-subdivision-lattice",
]
cd-stream-bench = ["dep:psx-io", "psx-game-runtime/cd-stream-bench"]
cd-stream-benchmark = ["cd-stream-bench", "psx-game-runtime/cd-stream-benchmark"]
boot-trace = ["psx-engine/boot-trace", "psx-rt/boot-trace"]
emulator-telemetry = ["psx-engine/emulator-telemetry"]
hardware-boot-visual = ["psx-engine/hardware-boot-visual"]
# The HWB explosion-hunt live-capture overlay (4 cycling pages + the
# engine-side per-vertex capture). NOT a default: it costs real cycles
# and draw packets, so probe builds request it explicitly via
# EDITOR_PLAYTEST_FEATURES="... vert-debug-overlay".
vert-debug-overlay = ["psx-engine/vert-debug"]
world-order-global = []
world-order-slot = []
world-order-linked = []
world-order-bucketed = []
world-grid-visible = ["psx-game-runtime/world-grid-visible"]
vis-anchor-cache = ["psx-game-runtime/vis-anchor-cache"]
vis-anchor-pvs-candidates = ["psx-game-runtime/vis-anchor-pvs-candidates"]
vis-broad-pvs = ["psx-game-runtime/vis-broad-pvs"]
vis-coarse-yaw = ["psx-game-runtime/vis-coarse-yaw"]
vis-full-active-chunks = ["psx-game-runtime/vis-full-active-chunks"]
vis-player-anchor = []
# Drawn set = the frustum-clipped portal traversal (per-room draw_distance
# far clamp + portal narrowing) instead of the unpruned reachability ring.
# Opt-in until the pop-in behaviour passes an eyes-on gate.
vis-draw-pruned = []
room-surface-profile = ["psx-engine/room-surface-profile"]
# Diagnostic-only cadence for semantic A/B comparisons. Render exactly once
# per two fixed simulation ticks even when wall-clock VBlanks have accumulated,
# so faster and slower builds present the same guest states.
lockstep-visuals = []
# A/B candidate: project the nine unique points of a one-level subdivided
# room quad once, instead of projecting four overlapping child quads.
tr-subdivision-lattice = ["psx-engine/tr-subdivision-lattice"]
# Opt-in for projects whose close, strongly patterned ceilings visibly need
# affine correction. The measured default spends subdivision on floors/walls.
tr-subdivision-ceilings = []
# Experiment-only stress profile that expands the distance band fourfold so
# the upward-camera tape exercises ceiling subdivision even in tall rooms.
tr-subdivision-wide-band = []
# Experiment-only reference cadence for measuring the existing 30 Hz NPC
# schedule against collision/decision work on every 60 Hz simulation tick.
npc-think-60hz = []
# Reference build for measuring the cost of the existing single-quad actor
# shadow implementation.
actor-shadows-off = []
cell-select-profile = ["psx-engine/cell-select-profile"]
# High-contrast TR subdivision colors for emulator wireframe captures.
# Diagnostic only: normal builds retain authored Gouraud lighting.
tessellation-debug = []
# On-screen presented-fps + worst-frame-gap counter for hardware
# ratification burns. Off by default: shipping builds must not carry it.
fps-overlay = []
ot-1024 = []
ot-2048 = []

[dependencies]
psx-asset  = { path = "../../../sdk/crates/psx-asset" }
psx-bsp    = { path = "../../crates/psx-bsp" }
psx-engine = { path = "../../crates/psx-engine" }
psx-game-runtime = { path = "../../crates/psx-game-runtime" }
psx-font   = { path = "../../../sdk/crates/psx-font" }
psx-gpu    = { path = "../../../sdk/crates/psx-gpu" }
psx-gte    = { path = "../../../sdk/crates/psx-gte" }
psx-io     = { path = "../../../sdk/crates/psx-io", optional = true }
psx-level  = { path = "../../crates/psx-level" }
psx-math   = { path = "../../../sdk/crates/psx-math" }
psx-rt     = { path = "../../../sdk/crates/psx-rt", features = ["alloc"] }
psx-vram   = { path = "../../../sdk/crates/psx-vram" }
psxed-format = { path = "../../../editor/crates/psxed-format" }
