name: Deploy web emulator to Pages

# Builds the editor-less emulator frontend to wasm (release) and publishes it to
# GitHub Pages. Release is mandatory: a debug wasm emulator is ~10-50x slower.
on:
  push:
    branches: [main]
    paths:
      - "emu/**"
      - "crates/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target (honors rust-toolchain.toml)
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C "$HOME/.cargo/bin"
          trunk --version

      - name: Configure Pages (self-enables on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build (release, emulator-only, /PSoXide/ base)
        working-directory: emu/crates/frontend
        env:
          # WebAssembly-2.0 SIMD baseline (all current engines). Mirrors
          # the local (gitignored) .cargo/config.toml -- CI can't read
          # that file, so the flag lives here for the shipped build. The
          # larger stack keeps deep save-state encode/decode walks clear of
          # wasm-ld's 1 MiB default.
          RUSTFLAGS: -C target-feature=+simd128 -C link-arg=-zstack-size=16777216
        run: trunk build --release --public-url "/PSoXide/"

      # The demo disc is streamed at runtime, not baked into the wasm: the
      # image is ~200 MB, past GitHub's file limit and past what an
      # include_bytes! payload tolerates. The demo-disc repo's `make
      # release-web` presses the disc and splits it into the delivery set
      # (gzipped data track, FLAC per audio track, manifest with checksums)
      # on the rolling `web-disc` release; this stages those pieces as plain
      # static files beside the wasm, so every frontend fetch is same-origin.
      # The full .bin stays on the release as a download mirror but is not
      # shipped to Pages. The release lives on THIS repo: the demo-disc repo
      # is private, and the workflow token cannot read another repo's
      # releases.
      - name: Stage the streamed demo disc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download web-disc \
            --repo EBonura/PSoXide \
            --pattern 'demo-disc.cue' \
            --pattern 'web-manifest.txt' \
            --pattern 'demo-data.bin.gz' \
            --pattern 'track-*.flac' \
            --dir emu/crates/frontend/dist
          ls -la emu/crates/frontend/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: emu/crates/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The artifact carries the demo disc's streamed delivery (~130 MB
          # of FLAC), and Pages takes longer than the default ten minutes to
          # settle a deployment that size.
          timeout: 1800000
