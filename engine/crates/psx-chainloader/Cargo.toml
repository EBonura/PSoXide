[package]
name = "psx-chainloader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared PSX collection executable transport, diagnostics and hardware handoff"

[lints]
workspace = true

[dependencies]
psx-pack = { path = "../../../sdk/crates/psx-pack" }
psx-io = { path = "../../../sdk/crates/psx-io" }
# The SDK's DMA-safe instruction-cache flush. Without the runtime: the blob that links this
# crate brings its own entry point and panic handler.
psx-rt = { path = "../../../sdk/crates/psx-rt", default-features = false }
psx-hw = { path = "../../../crates/psx-hw" }
psx-font = { path = "../../../sdk/crates/psx-font" }
