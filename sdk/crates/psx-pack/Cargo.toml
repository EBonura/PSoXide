[package]
name         = "psx-pack"
version      = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description  = "Guest-side WORLD.PAK (PSOXWPAK) parsing and in-place HLZC/LZ4 chunk decompression. The reader half of psx-iso's pack writer."

[dependencies]
# Pure logic, no MMIO, no deps: builds for the guest and the host alike.

[dev-dependencies]
# Host tests round-trip against the REAL producers: psx-iso is the pack
# writer mkisopsx uses, lz4_flex is the compressor behind
# --world-pack-compress-rooms (same version pin as tools/mkisopsx).
psx-iso  = { path = "../../../crates/psx-iso" }
lz4_flex = { version = "0.11", default-features = false }

[lints]
workspace = true
